user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;

    # 上传大文件（Excel 批导、身份证照片等附件）
    client_max_body_size 50m;
    client_body_buffer_size 256k;

    # gzip
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml+rss application/atom+xml image/svg+xml
                      application/x-font-ttf font/opentype application/vnd.ms-fontobject;

    # WebSocket 升级 header 映射（未来 站内通知/长连接 使用）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 上游服务定义（便于统一修改）
    upstream ticket_backend {
        server backend:3000;
        keepalive 32;
    }

    upstream ticket_frontend {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ========= API 反向代理 =========
        # SSE 通知流：关闭缓冲、延长读超时（必须在通用 /api/ 之前匹配）
        location ~ ^/api/(events|notifications)/ {
            proxy_pass         http://ticket_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;
            proxy_read_timeout 1h;
        }

        location /api/ {
            proxy_pass         http://ticket_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_buffering       on;
        }

        # ========= 健康检查直通（不走前端 SPA 兜底） =========
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # ========= 附件下载（后端生成的文件直接走 nginx 响应，后端只校验签名/重定向） =========
        location /files/ {
            alias /var/www/uploads/;
            # 后端返回 X-Accel-Redirect 指向 /files/xxx 时，nginx 直接读文件
            internal;
            add_header Cache-Control "private, no-cache";
        }

        # ========= 前端静态资源 =========
        # frontend 容器已经是 nginx 部署了 SPA，这里直接反代
        location / {
            proxy_pass         http://ticket_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 错误页
        error_page 500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
